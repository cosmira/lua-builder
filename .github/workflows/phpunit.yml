name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        lua: ['lua5.1', 'lua5.4']
        dependencies: [highest]
        include:
          - php: '8.2'
            lua: lua5.1
            dependencies: lowest
          - php: '8.5'
            lua: lua5.2
            dependencies: highest
          - php: '8.5'
            lua: lua5.3
            dependencies: highest
          - php: '8.5'
            lua: luajit
            dependencies: highest
    name: PHP ${{ matrix.php }} / ${{ matrix.lua }} / ${{ matrix.dependencies }}
    env:
      LUA_BIN: ${{ matrix.lua }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y "$LUA_BIN"
      - name: Install dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer test -- --fail-on-skipped
      - name: Run examples
        run: |
          set -o pipefail
          php examples/configuration.php | "$LUA_BIN" -
          php examples/functions.php | "$LUA_BIN" -
          php examples/tables.php | "$LUA_BIN" -
